# Uniform block name, must match the block name in the shader.
# Uniform 块名，需与着色器内 block 名一致。
name = "LightingParams"

# Lightmap origin in tile coordinates (x, y).
# 光照贴图原点（瓦片坐标，x, y）。
[[members]]
name = "u_lightmap_origin"
type = "vec2"
source = "@builtin.lightmap_origin"

[[members]]
name = "u_lightmap_size"
type = "vec2"
source = "@builtin.lightmap_size"

[[members]]
name = "u_camera_position"
type = "vec2"
source = "@builtin.camera_position"

[[members]]
name = "u_camera_size"
type = "vec2"
source = "@builtin.camera_size"

[[members]]
name = "u_zoom"
type = "float"
source = "@builtin.zoom"

[[members]]
name = "u_tile_size"
type = "float"
source = "@builtin.tile_size"

[[members]]
name = "u_min_visibility"
type = "float"
