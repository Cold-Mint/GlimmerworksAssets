# Tile glow shader: adds a warm glow tint with a slow time pulse.
# 瓦片发光着色器：叠加暖色光并随时间缓慢脉动。
set = 3
binding = 0

[[members]]
name = "u_glow_color"
type = "vec4"
source = "static"
value = [1.0, 0.4, 0.1, 1.0]

[[members]]
name = "u_glow_strength"
type = "float"
source = "static"
value = [2.0]

[[members]]
name = "u_time"
type = "float"
source = "@builtin.time_of_day"
