# Sky gradient uniforms (top/horizon colors interpolated by the engine).
# 天空渐变 uniform（顶部/地平线颜色由引擎插值）。
set = 3
binding = 0

[[members]]
name = "u_sky_top"
type = "vec4"
source = "@builtin.sky_top_color"

[[members]]
name = "u_sky_horizon"
type = "vec4"
source = "@builtin.sky_horizon_color"

[[members]]
name = "u_time"
type = "float"
source = "@builtin.time_of_day"
