#Standard alpha blending with a per-command tint color.
#带每命令染色颜色的标准 alpha 混合。
blend_mode = 1
[vertex_shader]
pack_id = "@core"
resource_key = "tint"
resource_type = "shader_vertex"

[fragment_shader]
pack_id = "@core"
resource_key = "tint"
resource_type = "shader_fragment"

[[vertex_uniform_block]]
pack_id = "@core"
resource_key = "default"
resource_type = "uniform_block"

[[fragment_uniform_block]]
pack_id = "@core"
resource_key = "tint"
resource_type = "uniform_block"
